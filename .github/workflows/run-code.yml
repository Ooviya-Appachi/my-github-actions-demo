name: Run Node program

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-program:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run the program
        run: npm start